name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'ws-plugin/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'ws-plugin/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: Manager app (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build manager APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts/manager
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} artifacts/manager/ \;
          ls -lh artifacts/manager

      - name: Upload manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-manager-apk
          path: artifacts/manager/*.apk
          if-no-files-found: error

  websocket-plugin:
    name: WebSocket plugin (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build plugin APKs
        working-directory: ws-plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :stub:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        working-directory: ws-plugin
        run: |
          mkdir -p ../artifacts/plugin
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} ../artifacts/plugin/ \;
          ls -lh ../artifacts/plugin

      - name: Upload plugin APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-websocket-plugin-apk
          path: artifacts/plugin/*.apk
          if-no-files-found: error

  release:
    name: Publish release (app + plugin + sources + sha256)
    needs: [ manager, websocket-plugin ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          PLUGIN_VERSION=$(grep -m1 'versionName' ws-plugin/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          mkdir -p out
          MANAGER_APK="MotionEmulator-${VERSION}-universal-debug.apk"
          PLUGIN_APK="MotionEmulator-WebsocketPlugin-${PLUGIN_VERSION}-universal-debug.apk"

          # 本体（manager）：只发布 universal（全 ABI，debug 签名可直接安装）
          cp "dist/motion-emulator-manager-apk/app-universal-debug.apk" "out/${MANAGER_APK}"
          # 插件：ABI splits 后同样只发布 universal；没有 splits 时回退到单一 APK
          if [ -f "dist/motion-emulator-websocket-plugin-apk/app-universal-debug.apk" ]; then
            cp "dist/motion-emulator-websocket-plugin-apk/app-universal-debug.apk" "out/${PLUGIN_APK}"
          else
            cp "dist/motion-emulator-websocket-plugin-apk/app-debug.apk" "out/${PLUGIN_APK}"
          fi

          ls -lh out
          # 校验和直接写进 release 说明，不再作为 assets 上传
          echo "MANAGER_APK=${MANAGER_APK}" >> "$GITHUB_ENV"
          echo "PLUGIN_APK=${PLUGIN_APK}" >> "$GITHUB_ENV"
          echo "MANAGER_SHA=$(sha256sum "out/${MANAGER_APK}" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PLUGIN_SHA=$(sha256sum "out/${PLUGIN_APK}" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **MotionEmulator ${VERSION}** · build #${GITHUB_RUN_NUMBER}

          提交 \`${GITHUB_SHA}\` · [构建日志](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## 下载

          | 文件 | 说明 | SHA-256 |
          | --- | --- | --- |
          | \`${MANAGER_APK}\` | 本体，universal（arm64 / armv7 / x86_64），debug 签名，可直接安装 | \`${MANAGER_SHA}\` |
          | \`${PLUGIN_APK}\` | 插件（LSPosed 模块），universal，配合本体使用 | \`${PLUGIN_SHA}\` |

          GitHub 会为本 tag 自动附加源代码包（Source code (zip) / Source code (tar.gz)），无需额外上传。

          ## 校验

          \`\`\`bash
          sha256sum "${MANAGER_APK}"   # ${MANAGER_SHA}
          sha256sum "${PLUGIN_APK}"    # ${PLUGIN_SHA}
          \`\`\`

          ## 说明

          - 本体为 **debug 签名**（便于直接安装）；README 建议的 release 变体未签名，可在本次构建的 Actions artifacts 中获取后自行签名。
          EOF
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets"
            gh release upload "$TAG" "out/${MANAGER_APK}" "out/${PLUGIN_APK}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md --latest
          else
            gh release create "$TAG" "out/${MANAGER_APK}" "out/${PLUGIN_APK}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
