name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'ws-plugin/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'ws-plugin/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: Manager app (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build manager APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts/manager
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} artifacts/manager/ \;
          ls -lh artifacts/manager

      - name: Upload manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-manager-apk
          path: artifacts/manager/*.apk
          if-no-files-found: error

  websocket-plugin:
    name: WebSocket plugin (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build plugin APKs
        working-directory: ws-plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :stub:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        working-directory: ws-plugin
        run: |
          mkdir -p ../artifacts/plugin
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} ../artifacts/plugin/ \;
          ls -lh ../artifacts/plugin

      - name: Upload plugin APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-websocket-plugin-apk
          path: artifacts/plugin/*.apk
          if-no-files-found: error

  release:
    name: Publish release (app + plugin + sources + sha256)
    needs: [ manager, websocket-plugin ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          PLUGIN_VERSION=$(grep -m1 'versionName' ws-plugin/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          mkdir -p out
          MANAGER_APK="MotionEmulator-${VERSION}-universal-debug.apk"
          PLUGIN_APK="MotionEmulator-WebsocketPlugin-${PLUGIN_VERSION}-universal-debug.apk"

          # 鏈綋锛坢anager锛夛細鍙彂甯?universal锛堝叏 ABI锛宒ebug 绛惧悕鍙洿鎺ュ畨瑁咃級
          cp "dist/motion-emulator-manager-apk/app-universal-debug.apk" "out/${MANAGER_APK}"
          # 鎻掍欢锛欰BI splits 鍚庡悓鏍峰彧鍙戝竷 universal锛涙病鏈?splits 鏃跺洖閫€鍒板崟涓€ APK
          if [ -f "dist/motion-emulator-websocket-plugin-apk/app-universal-debug.apk" ]; then
            cp "dist/motion-emulator-websocket-plugin-apk/app-universal-debug.apk" "out/${PLUGIN_APK}"
          else
            cp "dist/motion-emulator-websocket-plugin-apk/app-debug.apk" "out/${PLUGIN_APK}"
          fi

          ls -lh out
          # 鏍￠獙鍜岀洿鎺ュ啓杩?release 璇存槑锛屼笉鍐嶄綔涓?assets 涓婁紶
          echo "MANAGER_APK=${MANAGER_APK}" >> "$GITHUB_ENV"
          echo "PLUGIN_APK=${PLUGIN_APK}" >> "$GITHUB_ENV"
          echo "MANAGER_SHA=$(sha256sum "out/${MANAGER_APK}" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PLUGIN_SHA=$(sha256sum "out/${PLUGIN_APK}" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **MotionEmulator ${VERSION}** 路 build #${GITHUB_RUN_NUMBER}

          鎻愪氦 \`${GITHUB_SHA}\` 路 [鏋勫缓鏃ュ織](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## 涓嬭浇

          | 鏂囦欢 | 璇存槑 | SHA-256 |
          | --- | --- | --- |
          | \`${MANAGER_APK}\` | 鏈綋锛寀niversal锛坅rm64 / armv7 / x86_64锛夛紝debug 绛惧悕锛屽彲鐩存帴瀹夎 | \`${MANAGER_SHA}\` |
          | \`${PLUGIN_APK}\` | 鎻掍欢锛圠SPosed 妯″潡锛夛紝universal锛岄厤鍚堟湰浣撲娇鐢?| \`${PLUGIN_SHA}\` |

          GitHub 浼氫负鏈?tag 鑷姩闄勫姞婧愪唬鐮佸寘锛圫ource code (zip) / Source code (tar.gz)锛夛紝鏃犻渶棰濆涓婁紶銆?
          ## 鏍￠獙

          \`\`\`bash
          sha256sum "${MANAGER_APK}"   # ${MANAGER_SHA}
          sha256sum "${PLUGIN_APK}"    # ${PLUGIN_SHA}
          \`\`\`

          ## 璇存槑

          - 鏈綋涓?**debug 绛惧悕**锛堜究浜庣洿鎺ュ畨瑁咃級锛汻EADME 寤鸿鐨?release 鍙樹綋鏈鍚嶏紝鍙湪鏈鏋勫缓鐨?Actions artifacts 涓幏鍙栧悗鑷绛惧悕銆?          - 鍒嗘灦鏋勭増鏈紙arm64-v8a / armeabi-v7a / x86_64 鍙婃湭绛惧悕 release锛夊彧浣滀负 Actions artifacts 淇濈暀锛屼笉杩涘叆 release銆?          - 鏈綋涓庢彃浠堕渶閰嶅浣跨敤锛氭彃浠剁敤浜庝慨澶嶅鐩戝惉鑰呭畾浣嶆淳鍙戞椂閫熷害鍑虹幇 NaN 鐨勯棶棰樸€?          EOF
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets"
            gh release upload "$TAG" "out/${MANAGER_APK}" "out/${PLUGIN_APK}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md --latest
          else
            gh release create "$TAG" "out/${MANAGER_APK}" "out/${PLUGIN_APK}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
