name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'manager-stub/**'
      - 'manager-update/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: Manager app (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build manager APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts/manager
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} artifacts/manager/ \;
          ls -lh artifacts/manager

      - name: Upload manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-manager-apk
          path: artifacts/manager/*.apk
          if-no-files-found: error

  websocket-plugin:
    name: WebSocket plugin (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Build plugin APKs
        working-directory: ws-plugin
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        working-directory: ws-plugin
        run: |
          mkdir -p ../artifacts/plugin
          find app/build/outputs/apk -name '*.apk' -exec cp -v {} ../artifacts/plugin/ \;
          ls -lh ../artifacts/plugin

      - name: Upload plugin APKs
        uses: actions/upload-artifact@v4
        with:
          name: motion-emulator-websocket-plugin-apk
          path: artifacts/plugin/*.apk
          if-no-files-found: error

  release:
    name: Publish release (app + plugin + sources + sha256)
    needs: [ manager, websocket-plugin ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          PLUGIN_VERSION=$(grep -m1 'versionName' ws-plugin/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          mkdir -p out
          # 本体（manager）：debug 变体带 debug 证书，可直接安装
          cp "dist/motion-emulator-manager-apk/app-universal-debug.apk"    "out/MotionEmulator-${VERSION}-universal-debug.apk"
          cp "dist/motion-emulator-manager-apk/app-arm64-v8a-debug.apk"    "out/MotionEmulator-${VERSION}-arm64-v8a-debug.apk"
          cp "dist/motion-emulator-manager-apk/app-armeabi-v7a-debug.apk"  "out/MotionEmulator-${VERSION}-armeabi-v7a-debug.apk"
          cp "dist/motion-emulator-manager-apk/app-x86_64-debug.apk"       "out/MotionEmulator-${VERSION}-x86_64-debug.apk"
          # 插件（LSPosed WebSocket module）
          cp "dist/motion-emulator-websocket-plugin-apk/app-debug.apk"     "out/MotionEmulator-WebsocketPlugin-${PLUGIN_VERSION}-debug.apk"
          # 源代码
          git archive --format=zip --prefix="MotionEmulator-${VERSION}/" -o "out/MotionEmulator-${VERSION}-source.zip" HEAD
          # 校验和
          ( cd out && sha256sum *.apk *.zip > SHA256SUMS.txt )
          ls -lh out
          cat out/SHA256SUMS.txt

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **MotionEmulator ${VERSION}** · build #${GITHUB_RUN_NUMBER}

          提交 \`${GITHUB_SHA}\` · [构建日志](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ## 下载

          | 文件 | 说明 |
          | --- | --- |
          | \`MotionEmulator-${VERSION}-universal-debug.apk\` | 本体，全 ABI（arm64 / armv7 / x86_64），debug 签名，可直接安装 |
          | \`MotionEmulator-${VERSION}-arm64-v8a-debug.apk\` | 本体，arm64 手机专用，体积更小 |
          | \`MotionEmulator-${VERSION}-armeabi-v7a-debug.apk\` | 本体，32 位 ARM 设备 |
          | \`MotionEmulator-${VERSION}-x86_64-debug.apk\` | 本体，模拟器 / x86_64 |
          | \`MotionEmulator-WebsocketPlugin-${PLUGIN_VERSION}-debug.apk\` | 插件（LSPosed 模块），配合本体使用 |
          | \`MotionEmulator-${VERSION}-source.zip\` | 源代码快照（同一提交） |
          | \`SHA256SUMS.txt\` | 以上所有文件的 SHA-256 校验和 |

          GitHub 还会为本 tag 自动附加 \`Source code (zip)\` 与 \`Source code (tar.gz)\`。

          ## 校验

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ## 说明

          - 本体为 **debug 签名**（便于直接安装）；README 建议的 release 变体未签名，可在本次构建的 Actions artifacts 中获取后自行签名。
          - 本体与插件需配套使用：插件用于修复多监听者定位派发时速度出现 NaN 的问题。
          EOF
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets"
            gh release upload "$TAG" out/*.apk out/*.zip out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md --latest
          else
            gh release create "$TAG" out/*.apk out/*.zip out/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MotionEmulator ${VERSION} (build #${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md \
              --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
